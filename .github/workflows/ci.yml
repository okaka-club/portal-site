name: ビルド確認

on:
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: ビルド
        run: npm run build

      - name: 内部リンク検証の回帰テスト
        run: npm run test:links

      - name: ビルド成果物の内部リンク検証
        run: npm run check:links
